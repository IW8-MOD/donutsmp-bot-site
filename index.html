<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFK Bot | DonutSMP 1.21</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f0f17;
      color: #e0e0e0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1a1b26;
      border: 1px solid #2ac3de;
      border-radius: 16px;
      padding: 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 { color: #7aa2f7; margin-bottom: 10px; font-size: 24px; }
    p { color: #a9b1d6; font-size: 14px; margin-bottom: 20px; }
    .badge {
      display: inline-block;
      background: #9ece6a;
      color: #15161e;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .info-list {
      text-align: left;
      background: #24283b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3b4261;
      font-size: 14px;
    }
    .info-item:last-child { border-bottom: none; }
    .label { color: #7dcfff; }
    .val { color: #c0caf5; font-weight: bold; }
    .footer { font-size: 12px; color: #565f89; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Minecraft AFK Bot</h1>
    <p>Sistem automat de menținere AFK găzduit direct de pe mobil.</p>
    
    <div class="badge">● STATUS: ONLINE 24/7</div>

    <div class="info-list">
      <div class="info-item">
        <span class="label">Server:</span>
        <span class="val">donutsmp.net</span>
      </div>
      <div class="info-item">
        <span class="label">Versiune:</span>
        <span class="val">1.21</span>
      </div>
      <div class="info-item">
        <span class="label">Găzduire:</span>
        <span class="val">Termux (Android)</span>
      </div>
      <div class="info-item">
        <span class="label">Auto-Reconnect:</span>
        <span class="val">Activat (5s)</span>
      </div>
    </div>

    <div class="footer">Proiect hosted on GitHub Pages</div>
  </div>
</body>
</html>
